apiVersion: batch/v1
kind: Job
metadata:
  name: notes-schema
  namespace: notes-lab
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: notes-schema
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/tommmdl/docker-lab@sha256:d8fdaffb99e0ac514b9e031ac9204b89fc2702112d198d1bebedd9d351fd19f0
          command: [python, migrate.py]
          envFrom:
            - configMapRef:
                name: notes-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: password
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: password
          secret:
            secretName: notes-db
            defaultMode: 0444
            items:
              - key: password
                path: db_password
